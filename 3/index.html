<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUCA</title>
    <link rel="stylesheet" href="style.css?v=luca-random-20261027" />
  </head>
  <body>
    <div class="sky-glow"></div>
    <div class="stars"></div>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">MY PLAYLIST</p>
          <h1 class="brand-title">LUCA</h1>
        </div>
        <div class="stat-pill">
          <span id="song-count">0</span> 首歌曲
        </div>
      </header>

      <div class="filter-wrap">
        <div class="filter-field">
          <label for="song-search">搜尋歌曲</label>
          <input id="song-search" type="search" placeholder="輸入歌曲名稱" autocomplete="off" oninput="filterSongs()" />
        </div>
        <div class="filter-field">
          <label for="genre-select">歌單分類</label>
          <select id="genre-select" onchange="filterSongs()">
            <option value="">全部歌單</option>
            <option value="中文歌單">中文歌單</option>
            <option value="英文歌單">英文歌單</option>
          </select>
        </div>
        <div class="random-control">
          <button id="random-song" class="random-button" type="button">隨機選歌</button>
          <span id="random-result" class="random-result" role="status" aria-live="polite"></span>
        </div>
      </div>

      <ul id="song-list" class="song-list"></ul>
    </div>

    <script src="script.js?v=luca-random-20261027"></script>
  </body>
</html>

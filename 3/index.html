<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>音樂歌單</title>
    <link rel="stylesheet" href="style.css?v=deep-blue-20261027" />
  </head>
  <body>
    <div class="sky-glow"></div>
    <div class="stars"></div>
    <div class="ocean"></div>

    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">MY PLAYLIST</p>
          <h1>音樂歌單</h1>
        </div>
        <div class="stat-pill">
          <span id="song-count">0</span> 首歌曲
        </div>
      </header>

      <div class="filter-wrap">
        <div class="filter-field">
          <label for="song-search">搜尋歌曲或歌手</label>
          <input id="song-search" type="search" placeholder="輸入歌曲名稱或歌手" autocomplete="off" oninput="filterSongs()" />
        </div>
        <div class="filter-field">
          <label for="genre-select">歌單分類</label>
          <select id="genre-select" onchange="filterSongs()">
            <option value="">全部歌單</option>
            <option value="中文歌單">中文歌單</option>
            <option value="英文歌單">英文歌單</option>
          </select>
        </div>
      </div>

      <ul id="song-list" class="song-list"></ul>
    </div>

    <div class="marine-life">
      <svg class="jelly-scene" viewBox="0 0 1000 700" role="img" aria-label="深海漂流水母群">
        <defs>
          <linearGradient id="jelly-bell-gradient" x1="0" y1="0" x2="1" y2="0.85">
            <stop offset="0" stop-color="#7564d6" />
            <stop offset="0.42" stop-color="#8799f1" />
            <stop offset="0.78" stop-color="#76bce9" />
            <stop offset="1" stop-color="#ACECE2" />
          </linearGradient>
          <g id="jellyfish-form">
            <g class="jelly-bell-pulse">
              <path class="jelly-bell" d="M48 222C55 126 120 62 214 58c94-4 162 58 168 151 2 26-9 48-30 55-19 7-35-7-48-20-13 25-41 34-64 17-17 23-49 23-68 1-20 22-51 18-65-6-21 13-46 5-57-14-6-9-5-15-2-20Z" />
              <path class="jelly-rim" d="M48 222c10 19 36 27 57 14 14 24 45 28 65 6 19 22 51 22 68-1 23 17 51 8 64-17 13 13 29 27 48 20 12-4 20-13 25-24" />
              <path class="jelly-speckles" d="M78 131C88 169 94 197 99 230M111 99c12 47 19 87 20 154M147 75c12 53 18 105 18 169M184 61c9 59 13 120 11 187M222 61c-1 64 4 127 15 185M260 74c-9 58-5 116 11 170M297 97c-15 49-11 94 7 141M332 131c-18 40-15 75-1 105" />
              <path class="jelly-ridge" d="M82 130c34-28 76-42 128-43m-94 71c28-22 60-34 97-35m-84 64c25-15 50-22 78-23" />
            </g>
            <path class="jelly-tentacle jelly-tentacle-bright" d="M87 244c-22 48 26 78-1 132-27 53 24 90-7 148-18 34-9 72 8 112" />
            <path class="jelly-tentacle" d="M111 254c12 52-26 82 8 135 33 51-12 88 16 145 16 33 12 68 4 99" />
            <path class="jelly-tentacle jelly-tentacle-fine" d="M137 263c-22 43 15 72-7 121-22 48 22 81 1 129-13 29-7 68 4 103" />
            <path class="jelly-tentacle jelly-tentacle-bright" d="M160 269c13 45-20 77 9 124 29 47-5 79 20 132 15 31 11 62 3 92" />
            <path class="jelly-tentacle" d="M185 271c-17 47 15 75-4 123-18 47 19 79 4 127-9 29 0 63 13 94" />
            <path class="jelly-tentacle jelly-tentacle-fine" d="M207 271c12 49-18 81 9 126 27 45-4 80 18 130 13 30 10 56 1 86" />
            <path class="jelly-tentacle jelly-tentacle-bright" d="M230 268c-18 43 18 77-1 122-19 47 21 83 3 132-10 28-1 61 12 91" />
            <path class="jelly-tentacle" d="M255 263c14 50-20 80 12 130 31 49-7 86 23 139 18 31 17 61 9 91" />
            <path class="jelly-tentacle jelly-tentacle-fine" d="M280 254c-23 45 18 78-4 127-22 49 24 84 1 134-13 30-8 60 4 91" />
            <path class="jelly-tentacle jelly-tentacle-bright" d="M305 244c12 47-24 77 10 127 34 49-10 87 20 140 18 32 14 65 5 95" />
            <path class="jelly-tentacle" d="M329 231c-19 47 24 80-3 130-27 51 21 85-2 137-13 31-4 64 10 97" />
            <circle class="jelly-bubble" cx="82" cy="282" r="5" />
            <circle class="jelly-bubble" cx="346" cy="302" r="4" />
            <circle class="jelly-bubble" cx="119" cy="371" r="3" />
            <circle class="jelly-bubble" cx="301" cy="424" r="5" />
            <circle class="jelly-bubble" cx="159" cy="492" r="3" />
            <circle class="jelly-bubble" cx="342" cy="547" r="3" />
          </g>
        </defs>
        <g class="jelly-drift"><use href="#jellyfish-form" class="jelly-copy" transform="translate(55 155) scale(.55)" /></g>
        <g class="jelly-drift"><use href="#jellyfish-form" class="jelly-copy" transform="translate(212 55) scale(.42)" /></g>
        <g class="jelly-drift"><use href="#jellyfish-form" class="jelly-copy" transform="translate(310 300) scale(.34)" /></g>
        <g class="jelly-drift"><use href="#jellyfish-form" class="jelly-copy" transform="translate(482 90) scale(.72)" /></g>
        <g class="jelly-drift"><use href="#jellyfish-form" class="jelly-copy" transform="translate(675 210) scale(.46)" /></g>
        <g class="jelly-drift"><use href="#jellyfish-form" class="jelly-copy" transform="translate(798 48) scale(.34)" /></g>
        <g class="jelly-drift"><use href="#jellyfish-form" class="jelly-copy" transform="translate(840 330) scale(.5)" /></g>
      </svg>
    </div>

    <script src="script.js"></script>
  </body>
</html>
